#
# Fake your home-position to JFK / Long Island when using
# option "--device adsb.fi":
#  c:\dev\dump1090> dump1090.exe --net --device adsb.fi --config %~dp0\dump1090-JFK.cfg
#
include = %~dp0\dump1090.cfg
logfile = %~dp0\dump1090-JFK.log

homepos  = 40.6399281,-73.7786922
location = false

#
# There are a huge number of planes around New York.
# Hence reduce the max range to 50 miles.
#
adsb-fi-max-distance = 50

